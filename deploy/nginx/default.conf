# =============================================================================
#  nginx 配置 —— 部署包用的就是这一份，容器内路径，朋友不需要改这个文件
#
#  它干两件事：
#    1. 把前端网页文件发出去（容器里的 /usr/share/nginx/html）
#    2. 把 /api 开头的请求转给后端容器（服务名 backend:8080）
#
#  容器内部固定监听 80，朋友改对外端口只改 .env 里的 WEB_PORT，不用碰这里。
# =============================================================================

server {
    listen       80;              # 容器内部端口，固定 80（对外端口由 compose 映射）
    server_name  _;               # 不校验域名：用 IP、域名、任何端口访问都能打开
    charset      utf-8;

    root  /usr/share/nginx/html;  # 前端文件目录（compose 把 ./web 挂到这里）
    index index.html;

    # 【重要】nginx 默认上传上限只有 1MB，发图片/文件会直接返回 413 错误。
    # 后端本身不限制大小，这里给 100m；要发大文件就改成 500m。
    client_max_body_size 100m;

    server_tokens off;            # 不对外暴露 nginx 版本号

    # ------------------------- gzip 压缩（前端主包 1.7MB，开了省流量） --------
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1k;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml font/woff font/woff2;

    # =========================================================================
    #  1) 接口代理：/api/...  ->  后端容器
    # =========================================================================
    #  ^~ 的意思是「命中这个前缀后，就不要再往下看正则 location 了」。
    #  少了它，/api/xxx.js 这种地址会被下面的静态资源规则抢走，导致接口 404。
    location ^~ /api/ {
        # 后端在 compose 里的服务名叫 backend，容器之间直接用服务名互访。
        # 所以这里绝对不能写 127.0.0.1:8080（那是容器自己的 8080，不是后端的）。
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;          # 保留外部访问用的域名/端口
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;   # 上传/下载大文件放宽
        proxy_read_timeout    300s;

        # 让后端自己决定缓存策略（图片、头像等由后端控制）
        proxy_buffering on;
    }

    # =========================================================================
    #  2) WebSocket 代理：/api/ws/...  ->  后端容器
    # =========================================================================
    #  聊天消息是 WebSocket 长连接，配置和普通接口不一样：
    #  必须带 Upgrade / Connection 头，超时时间要调很大，否则 60 秒就被断开。
    location ^~ /api/ws/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;     # 这两行是 WebSocket 必需
        proxy_set_header Connection "upgrade";         # 缺了会 400 / 连不上
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        proxy_read_timeout 3600s;     # 一个小时不断开
        proxy_send_timeout 3600s;
        proxy_buffering    off;       # 不走缓冲，消息实时推送
    }

    # =========================================================================
    #  3) 静态资源缓存（js/css/图片等，文件名带 hash，可以放心长缓存）
    # =========================================================================
    location ~* \.(?:js|css|png|jpe?g|gif|ico|svg|webp|woff2?|ttf|eot|mp3|mp4)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Service Worker / 推送脚本：必须禁止缓存，否则前端更新后用户还在用旧的
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /OneSignalSDKWorker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # index.html 也不缓存，保证发新版马上生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # =========================================================================
    #  4) 单页应用（SPA）兜底 —— 必须放最后
    # =========================================================================
    #  前端是 React Router。用户在 /chat 页面按 F5 时，磁盘上并没有 chat 这个文件，
    #  所以要回落到 index.html 让前端路由自己处理，否则刷新就 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
