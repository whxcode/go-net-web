# =============================================================================
#  PaperPhonePlus 一键部署（前端 + 后端 + MySQL + Redis）
#
#  日常只需要改同目录的 .env（端口、密码），本文件不用动。
#
#  启动：  docker compose up -d
#  停止：  docker compose down            （数据都留着）
#  清空重来：docker compose down -v        （连数据库一起删掉！）
#  看日志：docker compose logs -f
#
#  网络结构：
#    外网 --> web(nginx, 对外 ${WEB_PORT}) --内网--> backend:8080 --> mysql / redis
#    只有 nginx 对外开端口，后端和数据库都不暴露，所以不会和服务器上
#    已有的 MySQL/Redis/其它服务撞端口。
#
#  容器名说明：故意不写 container_name，容器名由 compose 自动生成
#  （im-deploy-web-1 这种），这样即使服务器上已经跑着别的 MySQL/Redis
#  容器也不会重名冲突。要操作某个服务统一用 docker compose exec <服务名>。
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # 1. 前端：nginx 托管网页 + 反向代理接口（唯一对外暴露的服务）
  # ---------------------------------------------------------------------------
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      # 左边是服务器对外端口（读 .env 的 WEB_PORT，默认 8081），右边是容器内固定 80。
      # 朋友的服务器上只要 WEB_PORT 没被占用就行，改完重新 up -d 即可。
      - "${WEB_PORT:-8081}:80"
    volumes:
      # 前端静态文件（打包时已放好；以后要更新前端，直接替换这个目录里的内容再 restart）
      - ./web:/usr/share/nginx/html:ro
      # nginx 配置，只读挂载。改了以后：docker compose restart web
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks: [im-net]

  # ---------------------------------------------------------------------------
  # 2. 后端 go-net（Go + Gin + GORM）
  # ---------------------------------------------------------------------------
  backend:
    # 镜像名字。images/ 里已经带了打好包的 im-backend:latest，
    # start.sh 导入后就直接用它，不会触发下面的 build，离线也能跑。
    image: im-backend:latest
    # 只有本机没有 im-backend:latest 时才用这里的源码现场编译
    # （例如用了不含镜像的精简包，或者你改了 backend/src 里的代码要重编）。
    # 平时用不到，装了镜像就会被忽略。
    build:
      context: ./backend/src
      dockerfile: Dockerfile
    restart: unless-stopped
    # 注意：故意不写 ports。后端只在内部网络里跑，只有 nginx 能访问它。
    # 这样既安全，也不用担心朋友服务器上 8080 被占用。
    volumes:
      # 后端配置文件：里面写的是 mysql:3306 / redis:6379（compose 服务名）
      - ./backend/config.json:/root/config.json:ro
      # 上传的头像/图片/附件。放在数据卷里，重启、删容器都不会丢。
      - backend-files:/root/fileStoragePath
      # 后端日志目录
      - backend-logs:/root/log
    environment:
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy     # 等 MySQL 真正能连上再启动后端
      redis:
        condition: service_started
    networks: [im-net]

  # ---------------------------------------------------------------------------
  # 3. MySQL 8（只在内部网络，不对外开端口）
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # 密码和库名读 .env；容器第一次初始化时才会用到
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-go-net}
      # 【必须保留】官方 mysql 镜像默认只创建 root@localhost，只允许容器内部连接。
      # 后端跑在另一个容器里，连过来会报 "Error 1130: Host '172.x.x.x' is not allowed
      # to connect to this MySQL server"。这一行让镜像额外创建 root@'%'（任意来源可连）。
      # 注意：只在【第一次初始化】时生效；已经初始化过的库要改，必须
      # docker compose down -v 重新初始化。
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    command:
      # 中文不能乱码，字符集固定 utf8mb4
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 【只在第一次启动、数据卷为空时执行】自动建库建表。
      # 以后再改这个文件不会重新执行；要重建就 docker compose down -v
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [im-net]

  # ---------------------------------------------------------------------------
  # 4. Redis（登录 token 存在这里，同样不对外）
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 开 AOF 持久化，重启后登录状态不会全掉
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [im-net]

# 容器之间的私有网络，服务名（mysql / redis / backend）就是主机名
networks:
  im-net:
    driver: bridge

# 数据卷：数据都在这里，docker compose down 不会删，down -v 才会删
volumes:
  mysql-data:      # 数据库
  redis-data:      # redis 持久化
  backend-files:   # 用户上传的文件
  backend-logs:    # 后端日志

